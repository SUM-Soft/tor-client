name: Deploy to VPS

on:
  workflow_call:
    inputs:
      full_image_name:
        description: "Image name with short git commit SHA"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      full_image_name:
        description: "Image name with short git commit SHA"
        required: true
        type: string

env:
  CONTAINER_NAME: tor-client

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to VPS
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            docker container stop ${{ env.CONTAINER_NAME }}
            docker container rm ${{ env.CONTAINER_NAME }}
            docker run -d -p 32905:32905 --restart always --name ${{ env.CONTAINER_NAME }} ${{ inputs.full_image_name }}
            docker ps