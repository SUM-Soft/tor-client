name: Build, Test and Publish

on:
  workflow_call:
    outputs:
      version:
        description: "From version.txt"
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    name: Build, Test and Publish
    runs-on: ubuntu-latest
    env:
      CONTAINER_NAME: tor-client-test
      TEST_USER: some-username
      TEST_PASSWORD: some-password
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout PR head
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout default branch
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v6

      - name: Get version from version.txt
        id: get-version
        run: echo "version=$(cat version.txt)" >> $GITHUB_OUTPUT

      - name: Get lowercased repository name
        id: repo_lowercase
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_lowercase.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.get-version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.actor != 'dependabot[bot]'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run the container image
        run: |
          docker run \
            --name ${{ env.CONTAINER_NAME }} \
            -d \
            -p 1080:1080 \
            -e USERNAME=${{ env.TEST_USER }} \
            -e PASSWORD=${{ env.TEST_PASSWORD }} \
            ghcr.io/${{ steps.repo_lowercase.outputs.name }}:latest

      - name: Wait for container to become healthy
        run: |
          echo "Waiting for container to become healthy..."
          for i in {1..10}; do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' ${{ env.CONTAINER_NAME }})
            echo "Container status: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy!"
              exit 0
            fi
            sleep 10
          done
          echo "Container did not become healthy in time."
          docker logs ${{ env.CONTAINER_NAME }}
          exit 1

      - name: Test the container image
        run: |
          curl --socks5 localhost:1080 --proxy-user "${{ env.TEST_USER }}:${{ env.TEST_PASSWORD }}" https://check.torproject.org/api/ip |
          grep '"IsTor":true' || exit 1

      - name: Push the container image
        if: github.actor != 'dependabot[bot]'
        run: docker push ghcr.io/${{ steps.repo_lowercase.outputs.name }} --all-tags
