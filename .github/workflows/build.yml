name: Build, Test and Publish

on:
  workflow_call:
    outputs:
      version:
        description: "From version.txt"
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    name: Build, Test and Publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from version.txt
        id: get-version
        run: echo "version=$(cat version.txt)" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.get-version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.actor != 'dependabot[bot]'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the container image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run the container image
        run: docker run -d -p 32905:32905 ${{ vars.IMAGE_NAME }}:latest

      - name: Sleep for 30 seconds
        run: sleep 30s
        shell: bash

      - name: Test the container image
        run: curl --socks5 localhost:32905 --socks5-hostname localhost:32905 https://check.torproject.org/api/ip | grep '"IsTor":true' || exit 1

      - name: Push the container image
        if: github.actor != 'dependabot[bot]'
        run: docker push ${{ vars.IMAGE_NAME }} --all-tags
