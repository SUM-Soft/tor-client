name: Build, Test and Publish

on:
  workflow_call:
    outputs:
      full_image_name:
        description: "Image name with short git commit SHA"
        value: ${{ jobs.build.outputs.output1 }}

concurrency:
  group: ${{github.ref_name}}
  cancel-in-progress: false

env:
  IMAGE_NAME: torik24/tor-client

jobs:
  build_test:
    name: Build, Test and Publish
    runs-on: ubuntu-latest
    outputs:
      output1: ${{ steps.short-sha.outputs.full_image_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short git commit SHA
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "SHORT_SHA=$calculatedSha" >> $GITHUB_ENV
          echo "full_image_name=${{ env.IMAGE_NAME }}:$calculatedSha" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.SHORT_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the container image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run the container image
        run: docker run -d -p 32905:32905 ${{ env.IMAGE_NAME }}:latest

      - name: Sleep for 30 seconds
        run: sleep 30s
        shell: bash

      - name: Test the container image
        run: curl --socks5 localhost:32905 --socks5-hostname localhost:32905 https://check.torproject.org/api/ip | grep '"IsTor":true' || exit 1

      - name: Push the container image
        run: |
          docker push ${{ env.IMAGE_NAME }} --all-tags
